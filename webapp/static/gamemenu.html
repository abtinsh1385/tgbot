<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>منوی بازی‌ها</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Tahoma, sans-serif;
            padding: 20px;
            background: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
            text-align: center;
        }
        #user-photo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            background: #ddd;
        }
        #user-name {
            font-size: 18px;
            font-weight: bold;
            margin-top: 10px;
        }
        #user-balance {
            font-size: 15px;
            color: #f5a623;
            margin-top: 4px;
        }
        .game-list {
            margin-top: 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .game-btn {
            padding: 14px;
            border-radius: 10px;
            background: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #fff);
            border: none;
            font-size: 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <img id="user-photo" src="" alt="عکس کاربر">
    <div id="user-name">در حال بارگذاری...</div>
    <div id="user-balance"></div>

    <div class="game-list">
        <button class="game-btn" onclick="openGame('guess')">🎲 حدس عدد</button>
        <button class="game-btn" onclick="openGame('coinflip')">🪙 شیر یا خط</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const userId = tg.initDataUnsafe.user?.id;

        async function loadUserInfo() {
            if (!userId) {
                document.getElementById('user-name').innerText = "خطا: کاربر شناسایی نشد";
                return;
            }

            try {
                const res = await fetch(`/api/user-info/${userId}`);
                const data = await res.json();

                if (data.error) {
                    document.getElementById('user-name').innerText = "خطا: " + data.error;
                    return;
                }

                document.getElementById('user-name').innerText = data.name;
                document.getElementById('user-balance').innerText = `💰 ${data.balance} سکه`;
            } catch (err) {
                document.getElementById('user-name').innerText = "خطا در دریافت اطلاعات";
            }
        }

        async function loadUserPhoto() {
            if (!userId) return;
            const img = document.getElementById('user-photo');
            img.src = `/api/user-photo/${userId}`;
            img.onerror = () => { img.style.display = 'none'; };
        }

        function openGame(name) {
            tg.sendData(JSON.stringify({ action: "open_game", game: name }));
        }

        loadUserInfo();
        loadUserPhoto();
    </script>
</body>
</html>
