<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    
    <title>پنل تنظیمات گروه</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Tahoma, sans-serif;
            padding: 20px;
            background: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
        }
        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        #group-photo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            background: #ddd;
        }
        #group-title {
            font-size: 18px;
            font-weight: bold;
            margin-top: 10px;
        }
        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 4px;
            border-bottom: 1px solid rgba(128,128,128,0.2);
        }
        .setting-label {
            font-size: 15px;
        }
        .setting-desc {
            font-size: 12px;
            color: gray;
            margin-top: 2px;
        }
        /* سوییچ سفارشی */
        .switch {
            width: 46px;
            height: 26px;
            border-radius: 13px;
            position: relative;
            cursor: pointer;
            transition: background 0.2s;
            flex-shrink: 0;
        }
        .switch.on { background: #4caf50; }
        .switch.off { background: #ccc; }
        .switch-knob {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: white;
            position: absolute;
            top: 2px;
            transition: right 0.2s;
        }
        .switch.on .switch-knob { right: 2px; }
        .switch.off .switch-knob { right: 20px; }
        .switch.loading { opacity: 0.5; pointer-events: none; }
    </style>
</head>
<body>
    <div class="header">
        <img id="group-photo" src="" alt="عکس گروه">
        <div id="group-title">در حال بارگذاری...</div>
    </div>

    <div class="setting-row">
        <div>
            <div class="setting-label">🛡️ ضدتبلیغ</div>
            <div class="setting-desc">حذف خودکار پیام‌های حاوی لینک یا تبلیغ</div>
        </div>
        <div class="switch off" id="antiAdSwitch" onclick="toggleAntiAd()">
            <div class="switch-knob"></div>
        </div>
    </div>

    <div class="setting-row">
        <div>
            <div class="setting-label">🔒 قفل کامل گفتگو</div>
            <div class="setting-desc">کاربران معمولی دیگر نمیتوانند چیزی بفرستند</div>
        </div>
        <div class="switch off" id="lockSwitch" onclick="toggleLock()">
            <div class="switch-knob"></div>
        </div>
    </div>

    <div class="setting-row">
        <div>
            <div class="setting-label">📎 منع رسانه</div>
            <div class="setting-desc">کاربران معمولی نمیتوانند فایل بفرستند</div>
        </div>
        <div class="switch off" id="mediaSwitch" onclick="toggleMedia()">
            <div class="switch-knob"></div>
        </div>
    </div>

    <div class="setting-row">
        <div>
            <div class="setting-label">🔁 منع فوروارد</div>
            <div class="setting-desc">حذف خودکار پیام‌های فورواردی</div>
        </div>
        <div class="switch off" id="forwardSwitch" onclick="toggleForward()">
            <div class="switch-knob"></div>
        </div>
    </div>

    <div class="setting-row">
        <div>
            <div class="setting-label">📣 منع منشن همه</div>
            <div class="setting-desc">حذف پیام منشن</div>
        </div>
        <div class="switch off" id="mentionSwitch" onclick="toggleMention()">
            <div class="switch-knob"></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const urlParams = new URLSearchParams(window.location.search);
        const chatId = urlParams.get('chat_id');

        function setSwitchState(el, isOn) {
            el.classList.remove('on', 'off');
            el.classList.add(isOn ? 'on' : 'off');
        }

        async function loadGroupInfo() {
            if (!chatId) {
                document.getElementById('group-title').innerText = "خطا: آیدی گروه پیدا نشد";
                return;
            }

            try {
                const res = await fetch(`/api/chat-info/${chatId}`);
                const data = await res.json();

                if (data.error) {
                    document.getElementById('group-title').innerText = "خطا: " + data.error;
                    return;
                }

                document.getElementById('group-title').innerText = data.title;
                if (data.has_photo) {
                    document.getElementById('group-photo').src = `/api/chat-photo/${chatId}`;
                }
            } catch (err) {
                document.getElementById('group-title').innerText = "خطا در دریافت اطلاعات";
            }
        }

        async function loadSettings() {
            try {
                const res = await fetch(`/api/settings/${chatId}`);
                const data = await res.json();
                setSwitchState(document.getElementById('antiAdSwitch'), data.anti_ad);
                setSwitchState(document.getElementById('lockSwitch'), data.chat_locked);
                setSwitchState(document.getElementById('mediaSwitch'), data.block_media);
                setSwitchState(document.getElementById('forwardSwitch'), data.block_forward);
                setSwitchState(document.getElementById('mentionSwitch'), data.block_mentions);
            } catch (err) {
                console.error(err);
            }
        }

        async function toggleAntiAd() {
            const el = document.getElementById('antiAdSwitch');
            el.classList.add('loading');

            try {
                const res = await fetch(`/api/settings/${chatId}/toggle_ad`, {
                    method: 'POST',
                    headers: {
                     'X-Telegram-Init-Data': tg.initData
        }
                });
                const data = await res.json();
                setSwitchState(el, data.anti_ad);
                tg.HapticFeedback.impactOccurred('light');
            } catch (err) {
                tg.showAlert('خطا در تغییر تنظیمات');
            } finally {
                el.classList.remove('loading');
            }
        }

        async function toggleLock() {
            const el = document.getElementById('lockSwitch');
            el.classList.add('loading');

            try {
                const res = await fetch(`/api/settings/${chatId}/toggle_lock`, {
                    method: 'POST',
                    headers: {
                     'X-Telegram-Init-Data': tg.initData
        }
                });
                const data = await res.json();
                setSwitchState(el, data.chat_locked);
                tg.HapticFeedback.impactOccurred('light');
            } catch (err) {
                tg.showAlert('خطا در تغییر تنظیمات');
            } finally {
                el.classList.remove('loading');
            }
        }

        async function toggleMedia() {
            const el = document.getElementById('mediaSwitch');
            el.classList.add('loading');

            try {
                const res = await fetch(`/api/settings/${chatId}/toggle_media`, {
                    method: 'POST',
                    headers: {
                     'X-Telegram-Init-Data': tg.initData
        }
                });
                const data = await res.json();
                setSwitchState(el, data.block_media);
                tg.HapticFeedback.impactOccurred('light');
            } catch (err) {
                tg.showAlert('خطا در تغییر تنظیمات');
            } finally {
                el.classList.remove('loading');
            }
        }

        async function toggleForward() {
            const el = document.getElementById('forwardSwitch');
            el.classList.add('loading');

            try {
                const res = await fetch(`/api/settings/${chatId}/toggle_forward`, {
                    method: 'POST',
                    headers: {
                     'X-Telegram-Init-Data': tg.initData
        }
                });
                const data = await res.json();
                setSwitchState(el, data.block_forward);
                tg.HapticFeedback.impactOccurred('light');
            } catch (err) {
                tg.showAlert('خطا در تغییر تنظیمات');
            } finally {
                el.classList.remove('loading');
            }
        }

        async function toggleMention() {
            const el = document.getElementById('mentionSwitch');
            el.classList.add('loading');

            try {
                const res = await fetch(`/api/settings/${chatId}/toggle_mention`, {
                    method: 'POST',
                    headers: {
                     'X-Telegram-Init-Data': tg.initData
        }
                });
                const data = await res.json();
                setSwitchState(el, data.block_mentions);
                tg.HapticFeedback.impactOccurred('light');
            } catch (err) {
                tg.showAlert('خطا در تغییر تنظیمات');
            } finally {
                el.classList.remove('loading');
            }
        }

        loadGroupInfo();
        loadSettings();
    </script>
</body>
</html>
